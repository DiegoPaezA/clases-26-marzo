function setup(){stopTimers();Sound.silence();document.body.classList.remove('playing');state=null;app.innerHTML=`<div class="setup-grid"><section class="intro"><span class="eyebrow">El gran reto de octavo</span><h1>Construye ideas.<br>Juega en <em>equipo.</em></h1><p class="muted">Materiales, propiedades y decisiones con evidencias.<br>Cada equipo defiende su respuesta. ¿Listos para construir?</p><div class="hero-art">${heroArt()}<span class="hero-note">UNA OBRA. MUCHAS DECISIONES.</span></div></section><section class="card setup-card">${saved?'<div class="resume"><span>Hay una partida guardada en este navegador.</span><button class="small btn" id="resume">Continuar</button></div>':''}<div class="card-top"><div><span class="eyebrow muted">Prepara la partida</span><h2>Tus equipos</h2></div><span class="step">01</span></div><form id="team-form" class="input-row"><input id="team-name" maxlength="28" placeholder="Nombre del equipo" aria-label="Nombre del equipo" autocomplete="off"><button class="btn" type="submit">+ Agregar</button></form><div id="team-list" class="team-list"></div><div class="settings"><label>Preguntas<select id="question-count"><option value="12">12 · unos 40 minutos</option><option value="16">16 · partida extendida</option><option value="20">20 · partida larga</option><option value="25">25 · todas las preguntas</option></select></label><label>Tiempo para pensar<select id="duration"><option value="45">45 segundos</option><option value="30">30 segundos</option><option value="60">60 segundos</option><option value="0">Sin reloj</option></select></label></div><div class="audio-setup"><label for="audio-mode">Ambiente del concurso</label><select id="audio-mode"><option value="full">♫ Música + efectos</option><option value="effects">Solo efectos</option><option value="mute">Sin sonido</option></select><button class="ghost small" id="test-sound" type="button">▶ Probar sonido</button></div><button class="lime start" id="start">¡Que empiece el reto! →</button><p class="notice" id="setup-error" role="status"></p><p class="micro">De 2 a 10 grupos · Todos responden cada pregunta · 100 puntos por acierto · Sin puntos por velocidad</p></section></div><div class="help-box"><div><strong>01 / Todos eligen</strong><p>Los equipos muestran A, B, C o D con tarjetas. Cambia de portavoz en cada ronda.</p></div><div><strong>02 / Tú registras</strong><p>Marca una opción por grupo desde tu computador. No necesitan celulares.</p></div><div><strong>03 / La idea se enciende</strong><p>Revela la solución, mira la animación y descubre cómo va el marcador.</p></div></div>`;
 function drawTeams(){document.getElementById('team-list').innerHTML=setupTeams.map((t,i)=>`<div class="team-item">${avatar(t,i)}<span>${esc(t.name)}</span><button data-remove="${i}" aria-label="Quitar ${esc(t.name)}">×</button></div>`).join('');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{setupTeams.splice(+b.dataset.remove,1);drawTeams();});}
 drawTeams();document.getElementById('team-form').onsubmit=e=>{e.preventDefault();const input=document.getElementById('team-name'),name=input.value.trim();const error=document.getElementById('setup-error');if(!name){error.textContent='Escribe un nombre para el grupo.';return;}if(setupTeams.length>=10){error.textContent='Puedes agregar hasta 10 grupos.';return;}if(setupTeams.some(t=>t.name.toLocaleLowerCase()===name.toLocaleLowerCase())){error.textContent='Ese nombre ya está en la partida.';return;}setupTeams.push({name,color:COLORS[setupTeams.length%COLORS.length]});input.value='';error.textContent='';drawTeams();input.focus();};
 document.getElementById('resume')?.addEventListener('click',()=>{state=JSON.parse(JSON.stringify(saved));syncSound();Sound.unlock();if(state.done)results();else game();});
 document.getElementById('test-sound').onclick=()=>{const previous=state;state={sound:true,volume:.35};Sound.cue('start');state=previous;};
 document.getElementById('start').onclick=()=>{if(setupTeams.length<2){document.getElementById('setup-error').textContent='Agrega al menos dos grupos para comenzar.';return;}const start=()=>{state={teams:setupTeams.map(t=>({...t})),ids:BANK.slice(0,+document.getElementById('question-count').value).map(q=>q.id),duration:+document.getElementById('duration').value,index:0,answers:{},records:[],revealed:false,done:false,sound:document.getElementById('audio-mode').value!=='mute',music:document.getElementById('audio-mode').value==='full',volume:.35,remaining:+document.getElementById('duration').value};Sound.unlock();persist();game();Sound.cue('start');};if(saved)confirmAction('¿Comenzar una partida nueva?','La partida guardada se reemplazará. Puedes continuarla y descargar sus estadísticas primero.',start);else start();};}
function current(){return BANK.find(q=>q.id===state.ids[state.index]);}
function points(i){return state.records.reduce((s,r)=>s+(r.answers[i]===r.correct?100:0),0);}
function sceneHTML(q,reveal=false,phase=0){return scene(q,reveal,phase);}
function game(){stopTimers();state.sound??=true;state.music??=true;state.volume??=.35;document.body.classList.add('playing');window.scrollTo(0,0);const q=current();app.innerHTML=`<div class="game-top"><div><span class="eyebrow muted">${state.revealed?'Solución revelada':'Todos los equipos juegan'}</span><div class="game-title"><b>Pregunta ${state.index+1}</b> de ${state.ids.length}<div class="progress"><div style="width:${(state.index+1)/state.ids.length*100}%"></div></div></div></div><div class="tools"><button class="ghost small" id="sound" aria-pressed="${state.sound}">${state.sound?'🔊 Sonido':'🔇 Silenciado'}</button><button class="ghost small" id="music" aria-pressed="${state.music}">♫ Música: ${state.music?'sí':'no'}</button><label class="volume-control">Volumen <input id="volume" type="range" min="0" max="100" value="${Math.round(state.volume*100)}" aria-label="Volumen del concurso"></label><button class="ghost small" id="download">↓ Estadísticas</button><button class="ghost small" id="finish">Terminar partida</button></div></div><div class="game-grid"><section class="card question-card"><div class="question-head"><span class="tag">Guía ${q.g} · ${q.topic}</span><span class="micro">${state.revealed?'Respuesta + explicación':'Elige A, B, C o D'}</span></div><h2 class="question-text">${q.q}</h2><div id="visual" class="visual">${sceneHTML(q,state.revealed)}</div><div class="options">${q.opts.map((o,i)=>`<div class="option ${state.revealed?(i===q.a?'correct':'wrong'):''}"><span class="letter">${LETTERS[i]}</span><span>${o}</span>${state.revealed&&i===q.a?'<span class="reveal-label">✓</span>':''}</div>`).join('')}</div>${state.revealed?`<div class="explanation" role="status"><strong>${LETTERS[q.a]} · ${q.opts[q.a]}</strong><p>${q.why}</p></div>`:''}<div class="question-footer"><div class="timer" id="timer"><span class="timer-num" id="timer-num"></span><button class="ghost small" id="timer-toggle"></button></div>${state.revealed?`<button class="btn" id="next">${state.index===state.ids.length-1?'Ver resultados ↗':'Siguiente pregunta →'}</button>`:'<span class="micro">Primero tarjetas. Después registramos.</span>'}</div></section><aside class="card answer-panel"><h3 class="panel-heading">${state.revealed?'Así va el reto':'Respuestas de los grupos'}</h3><p class="panel-sub">${state.revealed?'✓ Acierto: +100 puntos · Sin respuesta: 0':'Registra sus opciones antes de revelar.'}</p><div id="answer-list"></div>${!state.revealed?'<button class="lime reveal-button" id="reveal">Revelar solución ✦</button>':''}<div id="round-stats"></div><p class="micro" id="storage-note">La partida se guarda en este navegador. Puedes cerrar y continuar después.</p></aside></div>`;
 drawAnswers();updateTimer();if(!state.revealed&&state.duration&&state.remaining>0)runTimer();
 syncSound();
 document.getElementById('sound').onclick=()=>{state.sound=!state.sound;if(state.sound)Sound.unlock();syncSound();persist();const b=document.getElementById('sound');b.textContent=state.sound?'🔊 Sonido':'🔇 Silenciado';b.setAttribute('aria-pressed',state.sound);if(state.sound)Sound.cue('question');};
 document.getElementById('music').onclick=()=>{state.music=!state.music;if(state.music){state.sound=true;Sound.unlock();const b=document.getElementById('sound');b.textContent='🔊 Sonido';b.setAttribute('aria-pressed','true');}else Sound.stopMusic();syncSound();persist();const b=document.getElementById('music');b.textContent='♫ Música: '+(state.music?'sí':'no');b.setAttribute('aria-pressed',state.music);};
 document.getElementById('volume').oninput=e=>{state.volume=+e.target.value/100;Sound.volume(state.volume);persist();};
 document.getElementById('download').onclick=downloadCSV;document.getElementById('finish').onclick=()=>confirmAction('¿Terminar la partida?','Verás los resultados de las preguntas ya reveladas. La pregunta actual sin revelar no contará.',()=>{state.done=true;persist();results();});
 document.getElementById('reveal')?.addEventListener('click',()=>{let missing=state.teams.filter((_,i)=>state.answers[i]===undefined).length;if(missing)confirmAction(missing===1?'Falta una respuesta':'Faltan '+missing+' respuestas','Puedes volver para registrarlas o revelar ahora. Los grupos sin respuesta sumarán 0 puntos en esta pregunta.',reveal);else reveal();});
 document.getElementById('next')?.addEventListener('click',()=>{if(state.index===state.ids.length-1){state.done=true;persist();results();return;}state.index++;state.answers={};state.revealed=false;state.remaining=state.duration;Sound.unlock();persist();game();Sound.cue('question');});
 document.getElementById('timer-toggle').onclick=()=>{if(state.revealed||!state.duration)return;if(timer){clearInterval(timer);timer=null;Sound.stopMusic();}else{Sound.unlock();if(state.remaining===0)state.remaining=state.duration;runTimer();}updateTimer();};
 if(state.revealed)animateSolution(q);
}
function drawAnswers(){const q=current();document.getElementById('answer-list').innerHTML=state.teams.map((t,i)=>`<div class="answer-row"><div class="answer-name">${avatar(t,i)}${esc(t.name)}<span class="score">${points(i)} pts</span></div><div class="answer-buttons">${LETTERS.map((l,j)=>`<button ${state.revealed?'disabled':''} data-team="${i}" data-answer="${j}" aria-label="${esc(t.name)}: opción ${l}" aria-pressed="${state.answers[i]===j}" class="${state.answers[i]===j?'selected '+(state.revealed?(j===q.a?'hit':'miss'):''):''}">${state.revealed&&state.answers[i]===j?(j===q.a?'✓ ':'× '):''}${l}</button>`).join('')}</div>${state.revealed&&state.answers[i]===undefined?'<span class="micro">Sin respuesta</span>':''}</div>`).join('');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{if(state.revealed)return;state.answers[b.dataset.team]=+b.dataset.answer;Sound.cue('select');persist();drawAnswers();});const count=Object.keys(state.answers).length;document.getElementById('round-stats').innerHTML=state.revealed?histogram(q):`<div class="round-status" role="status">${count} de ${state.teams.length} respuestas registradas</div>`;}
function histogram(q){const values=LETTERS.map((_,i)=>Object.values(state.answers).filter(a=>a===i).length),max=Math.max(1,...values);return `<div class="sidebar-stat"><span class="stats-title">Elecciones de esta ronda</span><div class="histogram">${values.map((n,i)=>`<div class="bar-wrap"><b>${n}</b><div class="bar ${i===q.a?'good':''}" style="height:${n/max*48}px"></div><span>${LETTERS[i]}</span></div>`).join('')}</div><p class="micro">${Object.values(state.answers).filter(a=>a===q.a).length} de ${state.teams.length} grupos acertaron.</p></div>`;}
function updateTimer(){const num=document.getElementById('timer-num'),btn=document.getElementById('timer-toggle');if(!num)return;num.textContent=state.revealed?'✓':!state.duration?'∞':`${Math.floor(state.remaining/60)}:${String(state.remaining%60).padStart(2,'0')}`;btn.textContent=state.revealed?'Ronda cerrada':!state.duration?'Sin reloj':timer?'Pausar':state.remaining===0?'Reiniciar':'Continuar';btn.disabled=state.revealed||!state.duration;document.getElementById('timer').classList.toggle('expired',!state.revealed&&state.duration>0&&state.remaining===0);}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{state.remaining=Math.max(0,state.remaining-1);if(state.remaining>0&&state.remaining<=5)Sound.cue('tick');if(state.remaining===0){clearInterval(timer);timer=null;Sound.stopMusic();Sound.cue('timeup');}persist();updateTimer();},1000);updateTimer();Sound.startMusic();}
function reveal(){if(state.revealed)return;stopTimers();const q=current();state.revealed=true;state.records.push({id:q.id,answers:{...state.answers},correct:q.a});persist();game();Sound.cue(Object.values(state.answers).some(a=>a===q.a)?'reveal':'retry');}
function animateSolution(q){const visual=document.getElementById('visual');visual.classList.add('reveal-visual');if(PHASED.includes(q.scene)){animTimers.push(setTimeout(()=>{if(!document.getElementById('visual'))return;visual.innerHTML=sceneHTML(q,true,1)+`<span class="visual-caption">${q.caption}</span>`;},1300));}else visual.innerHTML+=`<span class="visual-caption">${q.caption}</span>`;}
// Música y efectos originales, sintetizados localmente para funcionar sin internet.
const Sound = (() => {
 let ctx,master,musicBus,effectsBus,clock=null,step=0,nextBeat=0;
 const voices=new Set();
 const hz=n=>440*Math.pow(2,(n-69)/12);
 function unlock(){
  try{
   if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();musicBus=ctx.createGain();effectsBus=ctx.createGain();
    const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-12;limiter.ratio.value=8;
    musicBus.gain.value=.5;effectsBus.gain.value=.75;
    musicBus.connect(master);effectsBus.connect(master);master.connect(limiter);limiter.connect(ctx.destination);
   }
   if(ctx.state==='suspended')ctx.resume().catch(()=>{});
   volume(state?.volume??.35);return true;
  }catch(e){return false;}
 }
 function volume(value){if(master&&ctx)master.gain.setTargetAtTime(Math.min(1,Math.max(0,Number(value)||0)),ctx.currentTime,.025);}
 function tone(note,at,length=.16,level=.14,type='triangle',bus='effects',endNote){
  if(!ctx||!state?.sound)return;
  const start=Math.max(ctx.currentTime,at),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(hz(note),start);
  if(endNote!==undefined)o.frequency.exponentialRampToValueAtTime(hz(endNote),start+length);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(level,start+.008);
  g.gain.exponentialRampToValueAtTime(.0001,start+length);
  o.connect(g);g.connect(bus==='music'?musicBus:effectsBus);
  const voice={o,g,bus};voices.add(voice);o.onended=()=>{voices.delete(voice);o.disconnect();g.disconnect();};
  o.start(start);o.stop(start+length+.025);
 }
 function stopMusic(){clearInterval(clock);clock=null;for(const v of voices)if(v.bus==='music'){try{v.o.stop();}catch(e){}}}
 function silence(){stopMusic();for(const v of voices){try{v.o.stop();}catch(e){}}}
 function cue(name){
  if(!state?.sound||!unlock())return;const t=ctx.currentTime+.015;
  const melody=(notes,gap=.13,len=.22,amp=.16)=>notes.forEach((n,i)=>tone(n,t+i*gap,len,amp));
  if(name==='start'){
   melody([60,64,67,72,76],.12,.25);[48,60,64,67].forEach(n=>tone(n,t+.65,.65,.12));
  }else if(name==='question'){
   melody([67,74],.11,.15,.1);
  }else if(name==='select'){
   tone(84,t,.055,.075,'sine');
  }else if(name==='tick'){
   tone(state.remaining<=3?88:81,t,.075,.12,'sine');
  }else if(name==='timeup'){
   melody([76,71,64],.15,.28,.16);tone(48,t+.45,.4,.12);
  }else if(name==='reveal'||name==='retry'){
   for(let i=0;i<7;i++)tone(i%2?62:60,t+i*.045,.055,.08,'square');
   if(name==='reveal'){
    [72,76,79,84].forEach((n,i)=>tone(n,t+.35+i*.08,.4,.15));
    [48,60,64,67].forEach(n=>tone(n,t+.65,.55,.1));
   }else melody([67,64,60],.17,.3,.1);
  }else if(name==='finish'){
   melody([60,64,67,72,67,72,76,79],.14,.3,.15);
   [48,60,64,67,72].forEach(n=>tone(n,t+1.2,1.1,.12));
  }
 }
 function startMusic(){
  if(clock||!ctx||!state?.sound||state.music===false||state.revealed||state.done||document.hidden)return;
  if(state.duration&&(!timer||state.remaining===0))return;
  const tune=[72,null,76,79,null,76,74,null,71,null,74,77,null,74,72,null,
              69,null,72,76,null,72,71,null,67,null,71,74,76,74,71,null];
  const bass=[48,43,45,47];step=0;nextBeat=ctx.currentTime+.2;
  function schedule(){
   const urgent=state.duration>0&&state.remaining<=10,unit=60/(urgent?142:112)/2;
   while(nextBeat<ctx.currentTime+.18){
    const k=step%32,n=tune[k];
    if(n!==null)tone(n,nextBeat,unit*.72,.095,'triangle','music');
    if(k%4===0)tone(bass[Math.floor(k/8)],nextBeat,unit*1.65,.19,'sine','music');
    if(k%2===0)tone(36,nextBeat,.095,.12,'sine','music',24);
    if(k%4===2)tone(76,nextBeat,.045,.035,'square','music');
    nextBeat+=unit;step++;
   }
  }
  schedule();clock=setInterval(schedule,65);
 }
 return {unlock,volume,stopMusic,silence,cue,startMusic};
})();
function syncSound(){
 if(!state)return;
 state.sound??=true;state.music??=true;state.volume??=.35;
 Sound.volume(state.volume);
 if(!state.sound)Sound.silence();else Sound.startMusic();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)Sound.stopMusic();else syncSound();});
window.addEventListener('pagehide',()=>Sound.silence());

function results(){stopTimers();Sound.cue('finish');document.body.classList.remove('playing');window.scrollTo(0,0);const total=state.records.length,rank=state.teams.map((t,i)=>({...t,i,score:points(i)})).sort((a,b)=>b.score-a.score),all=total*state.teams.length,hits=rank.reduce((s,t)=>s+t.score/100,0),ties=rank.filter(t=>t.score===rank[0].score);let byType=type=>{const rows=state.records.filter(r=>BANK.find(q=>q.id===r.id).type===type),correct=rows.reduce((s,r)=>s+state.teams.filter((_,i)=>r.answers[i]===r.correct).length,0);return rows.length?Math.round(correct/(rows.length*state.teams.length)*100)+'%':'sin datos';};const reviews=state.records.map(r=>({q:BANK.find(q=>q.id===r.id),n:state.teams.filter((_,i)=>r.answers[i]===r.correct).length})).sort((a,b)=>a.n-b.n).slice(0,3);
app.innerHTML=`<section class="results-hero"><span class="eyebrow">La partida, en números</span><h1>${total?'¡Buena obra!':'Partida terminada'}</h1><p class="muted">${total?ties.length===1?`${esc(rank[0].name)} lidera con ${rank[0].score} puntos. ¡Todos se llevan nuevas ideas!`:`¡Hay empate! ${ties.map(t=>esc(t.name)).join(', ')} comparten el primer lugar.`:'Aún no se revelaron preguntas. Puedes iniciar otra partida.'}</p></section><div class="result-grid"><section class="card"><span class="eyebrow muted">Marcador final</span><h2>Cada acierto cuenta</h2>${rank.map((t,j)=>`<div class="rank-row"><span class="rank-number">${rank.findIndex(r=>r.score===t.score)+1}</span>${avatar(t,t.i)}<span class="rank-name"><strong>${esc(t.name)}</strong><span class="micro">${t.score/100} de ${total} aciertos · ${total?Math.round(t.score/100/total*100):0}%</span></span><span class="points">${t.score}<small class="micro"> pts</small></span></div>`).join('')}</section><section class="card"><span class="eyebrow muted">Así aprendió el salón</span><h2>Más allá del marcador</h2><div class="metric-grid"><div class="metric"><b>${total}</b><span>preguntas jugadas</span></div><div class="metric"><b>${all?Math.round(hits/all*100):0}%</b><span>aciertos del salón</span></div><div class="metric"><b>${state.teams.length}</b><span>equipos</span></div></div><p class="micro">${[1,2,3,4].map(n=>'Guía '+n+': <b>'+byType('g'+n)+'</b>').join(' · ')} de aciertos</p><h3 style="font-size:16px;margin-top:25px">Ideas para conversar al cierre</h3><div class="review-list">${reviews.map(r=>`<div class="review-item"><b>${r.q.q}</b><span>${r.n}/${state.teams.length} grupos acertaron · ${r.q.opts[r.q.a]}</span></div>`).join('')||'<p class="micro">Juega algunas preguntas para ver aquí qué conviene reforzar.</p>'}</div></section></div><div class="end-actions"><button class="btn" id="export">↓ Descargar estadísticas</button><button class="lime" id="again">Preparar otra partida →</button></div><p class="micro" style="text-align:center">Los porcentajes incluyen las preguntas sin respuesta como 0 aciertos. No se asignan notas.</p>`;
document.getElementById('export').onclick=downloadCSV;document.getElementById('again').onclick=()=>{saved=state;setupTeams=state.teams.map(t=>({...t}));setup();};}
function downloadCSV(){const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=[['Grupo','Pregunta','Tema','Enunciado','Opción elegida','Respuesta elegida','Opción correcta','Respuesta correcta','Acierto','Puntos de la pregunta','Total del grupo','Porcentaje de aciertos']];state.teams.forEach((t,i)=>{state.records.forEach((r,n)=>{const q=BANK.find(q=>q.id===r.id),a=r.answers[i];rows.push([t.name,n+1,q.topic,q.q,a===undefined?'Sin respuesta':LETTERS[a],a===undefined?'':q.opts[a],LETTERS[r.correct],q.opts[r.correct],a===r.correct?'Sí':'No',a===r.correct?100:0,points(i),state.records.length?Math.round(points(i)/state.records.length)+'%':'0%']);});});if(!state.records.length)state.teams.forEach(t=>rows.push([t.name,'','','','','','','','',0,0,'0%']));const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='construye-estadisticas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
setup();
